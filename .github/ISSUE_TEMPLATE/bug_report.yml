name: Bug report
description: Something on the site is broken or behaving wrongly
title: "[Bug] "
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. If a number or name is wrong rather than broken, use **Data correction** instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of what went wrong.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to the 2025 season
        2. Open the Monaco Grand Prix
        3. Scroll to Pit crew execution
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: dropdown
    id: season
    attributes:
      label: Season
      options: ["2024", "2025", "2026", "Not season specific"]
    validations:
      required: true
  - type: input
    id: page
    attributes:
      label: Page link
      description: Paste the URL of the page where it happens.
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: Chrome 130 on Windows 11
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Drag and drop images here.
