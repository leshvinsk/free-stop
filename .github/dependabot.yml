version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies]
    commit-message:
      prefix: chore
      include: scope
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /frontend
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies]
    commit-message:
      prefix: chore
      include: scope
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies]
    commit-message:
      prefix: chore
      include: scope
    groups:
      actions:
        patterns: ["*"]
