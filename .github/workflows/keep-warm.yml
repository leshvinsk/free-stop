name: Keep warm

on:
  schedule:
    - cron: '*/10 * * * *'  # every 10 minutes, so Render never reaches its 15 minute idle limit

permissions: {}

jobs:
  ping:
    name: Ping API
    runs-on: ubuntu-latest
    steps:
      - name: Health check
        run: curl -sf --max-time 30 https://free-stop-api.onrender.com/health
