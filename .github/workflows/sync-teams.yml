name: Sync team data

on:
  schedule:
    - cron: '0 6 * * *'        # daily at 06:00 UTC
    - cron: '0 * * * 4,5,6,0'  # hourly Thu–Sun (race weekends)
  workflow_dispatch:            # allow manual trigger from GitHub UI

jobs:
  sync:
    name: Scrape formula1.com
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install scraper dependencies
        run: pip install "httpx>=0.27" "beautifulsoup4>=4.12" "lxml>=5.2"

      - name: Scrape team data
        id: scrape
        run: python backend/scripts/scrape_teams.py

      - name: Commit if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/src/data/teams_scraped.json
          git diff --staged --quiet && echo "No changes." || (
            git commit -m "data: sync team data $(date -u +%Y-%m-%d)" &&
            git push
          )

      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = `[Alert] Team data sync failed ${new Date().toISOString().slice(0, 10)}`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'data-alert',
              state: 'open',
            });
            if (issues.some(i => i.title === title)) return; // deduplicate
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body: [
                '## Team data sync failed',
                '',
                `**Run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                '',
                'The scraper could not retrieve enough team data from formula1.com.',
                'Check whether the page structure changed and update `backend/scripts/scrape_teams.py` if needed.',
              ].join('\n'),
              labels: ['data-alert'],
            });
