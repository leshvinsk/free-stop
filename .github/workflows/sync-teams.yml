name: Sync team data

on:
  schedule:
    - cron: '0 6 * * *'        # daily at 06:00 UTC
    - cron: '0 * * * 4,5,6,0'  # hourly Thursday to Sunday (race weekends)
  workflow_dispatch:

permissions: {}

concurrency:
  group: sync-teams
  cancel-in-progress: false

jobs:
  sync:
    name: Scrape formula1.com
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
      statuses: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: dev

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install scraper dependencies
        run: pip install "httpx>=0.27" "beautifulsoup4>=4.12" "lxml>=5.2"

      - name: Scrape team data
        run: python backend/scripts/scrape_teams.py

      # dev is protected, so changes arrive as a pull request for the maintainer to approve
      - name: Open or update the data pull request
        id: cpr
        uses: peter-evans/create-pull-request@v8
        with:
          base: dev
          branch: bot/sync-team-data
          delete-branch: true
          add-paths: frontend/src/data/teams_scraped.json
          commit-message: "data: sync team data from formula1.com"
          title: "data: sync team data from formula1.com"
          labels: data
          body: |
            Automated update from the formula1.com team pages.

            Review the diff before merging. Verified values in `frontend/src/data/teamInfo.ts`
            always win over this file, so this only fills gaps for new seasons and new teams.

      # Pull requests opened with GITHUB_TOKEN do not trigger workflows on their own, so CI is
      # dispatched explicitly and the policy check (always satisfied by this bot) is reported directly
      - name: Run checks on the data pull request
        if: steps.cpr.outputs.pull-request-operation == 'created' || steps.cpr.outputs.pull-request-operation == 'updated'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ steps.cpr.outputs.pull-request-head-sha }}
        run: |
          gh workflow run ci.yml --repo "$REPO" --ref bot/sync-team-data
          gh api "repos/$REPO/statuses/$SHA" -f state=success -f context="PR policy" \
            -f description="Automated data pull request"

      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            const title = `[Alert] Team data sync failed ${new Date().toISOString().slice(0, 10)}`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'data-alert',
              state: 'open',
            });
            if (issues.some(i => i.title === title)) return;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body: [
                '## Team data sync failed',
                '',
                `**Run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                '',
                'The scraper could not retrieve enough team data from formula1.com.',
                'Check whether the page structure changed and update `backend/scripts/scrape_teams.py` if needed.',
              ].join('\n'),
              labels: ['data-alert'],
            });
