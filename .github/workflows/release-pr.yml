name: Release to main

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-to-main
  cancel-in-progress: false

jobs:
  release:
    name: Promote dev to main
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      statuses: write
    steps:
      # Every change on dev was already approved in its own pull request and passed CI
      # there, so the release pull request posts those results directly rather than waiting
      # for CI to re-run, which would expire pending approval for bot-created pull requests
      - name: Open the release pull request and enable auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          ahead=$(gh api "repos/$REPO/compare/main...dev" --jq '.ahead_by')
          if [ "$ahead" = "0" ]; then
            echo "dev has no changes waiting for main."
            exit 0
          fi

          changes=$(gh api "repos/$REPO/compare/main...dev" \
            --jq '.commits[] | select(.parents | length == 1) | "- " + (.commit.message | split("\n")[0])')

          # Squash commit subjects carry the PR number as "(#NNN)"; read closing
          # keywords from the PR body directly because GitHub does not preserve
          # the commit message body through the squash merge dialog.
          # grep exits 1 on no match, which pipefail treats as a failure, so every
          # search tolerates pull requests without a closing keyword, such as Dependabot's
          pr_numbers=$(gh api "repos/$REPO/compare/main...dev" \
            --jq '.commits[] | select(.parents | length == 1) | .commit.message | split("\n")[0]' | \
            { grep -Eo '\(#[0-9]+\)$' || true; } | { grep -Eo '[0-9]+' || true; })

          closes=""
          for pr_num in $pr_numbers; do
            pr_closes=$(gh api "repos/$REPO/pulls/$pr_num" --jq '.body // ""' | \
              { grep -Eioh '(closes|fixes|resolves|fix|close|resolve) #[0-9]+' || true; })
            if [ -n "$pr_closes" ]; then
              closes=$(printf '%s\n%s' "$closes" "$pr_closes")
            fi
          done
          closes=$(printf '%s' "$closes" | sort -u | { grep -v '^$' || true; } | tr '\n' ' ' | sed 's/ *$//')

          body=$(printf '%s\n\n%s\n\n%s\n' \
            "Automated release of the approved changes below from \`dev\` to \`main\`. This pull request merges itself once the checks pass, and the merge deploys the changes to production." \
            "## Included changes" \
            "$changes")

          if [ -n "$closes" ]; then
            body=$(printf '%s\n\n%s\n' "$body" "$closes")
          fi

          number=$(gh pr list --repo "$REPO" --base main --head dev --state open --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh pr edit "$number" --repo "$REPO" --body "$body"
          else
            gh pr create --repo "$REPO" --base main --head dev \
              --title "release: merge dev into main" --body "$body"
            number=$(gh pr list --repo "$REPO" --base main --head dev --state open --json number --jq '.[0].number')
          fi

          sha=$(gh api "repos/$REPO/git/ref/heads/dev" --jq '.object.sha')
          for context in "Backend checks" "Frontend checks" "PR policy"; do
            gh api "repos/$REPO/statuses/$sha" \
              -f state=success \
              -f context="$context" \
              -f description="Passed on dev before release"
          done

          gh pr merge "$number" --repo "$REPO" --auto --merge
          echo "Release pull request #$number will merge automatically when the checks pass."
