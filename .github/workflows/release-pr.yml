name: Release PR

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-pr
  cancel-in-progress: false

jobs:
  release-pr:
    name: Open or update the release pull request
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Open or update dev into main
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          ahead=$(gh api "repos/$REPO/compare/main...dev" --jq '.ahead_by')
          if [ "$ahead" = "0" ]; then
            echo "dev has no changes waiting for main."
            exit 0
          fi

          changes=$(gh api "repos/$REPO/compare/main...dev" \
            --jq '.commits[] | select(.parents | length == 1) | "- " + (.commit.message | split("\n")[0])')

          body=$(printf '%s\n\n%s\n\n%s\n\n%s\n' \
            "This pull request releases the changes below from \`dev\` to \`main\`. Merging it deploys them to the live site." \
            "## Included changes" \
            "$changes" \
            "Merge with **Create a merge commit** so that \`dev\` and \`main\` keep a shared history.")

          number=$(gh pr list --repo "$REPO" --base main --head dev --state open --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh pr edit "$number" --repo "$REPO" --body "$body"
            echo "Updated release pull request #$number."
          else
            gh pr create --repo "$REPO" --base main --head dev \
              --title "release: merge dev into main" --body "$body"
          fi
