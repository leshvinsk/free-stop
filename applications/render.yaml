services:
  - type: web
    name: free-stop-api
    runtime: python
    region: frankfurt
    # dev is the default branch; only reviewed releases on main are deployed
    branch: main
    buildCommand: pip install -e .
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    rootDir: backend
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: LOG_LEVEL
        value: INFO
      # Contact for Wikimedia Commons (race photos), whose robot policy requires one
      - key: WIKIMEDIA_CONTACT
        value: leshvinsk@gmail.com
      # Upstash Redis (persistent, unlike Render's free Key Value); value set in the dashboard
      - key: REDIS_URL
        sync: false

  - type: web
    name: free-stop-ui
    runtime: static
    branch: main
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    rootDir: frontend
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=300
    # Page addresses such as /race/9947 only exist inside the Vue app, so any path without a
    # matching file serves index.html and the app's router shows the right page
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://free-stop-api.onrender.com
